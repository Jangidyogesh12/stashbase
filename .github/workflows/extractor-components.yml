name: Publish PDF/OCR components

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

# Only one owner can create/publish a component set. Already published sets
# are immutable and are reused even when the application version changes.
concurrency:
  group: extractor-components
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.component.outputs.build }}
      version: ${{ steps.component.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export COMPONENT_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/prepare-extractor-release.mjs plan

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/prepare-native-components
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          key_path="$RUNNER_TEMP/extractor-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Sign and archive the independent component
        timeout-minutes: 25
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: pnpm build:extractor-component
      - name: Upload immutable component assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.plan.outputs.version }}
        run: node scripts/upload-release-assets.mjs release.nosync/stashbase-extract-*

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all component hashes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-extractor-release.mjs publish
