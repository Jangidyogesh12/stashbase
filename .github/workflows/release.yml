name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v2.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

# Serialize publication and retries; never cancel signing or asset publication.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  select-tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: node scripts/select-release-tag.mjs

  release-ci-gate:
    needs: select-tag
    if: needs.select-tag.outputs.tag != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-ci-gate.yml
    with:
      tag: ${{ needs.select-tag.outputs.tag }}

  prepare-draft:
    needs: [select-tag, release-ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-tag.outputs.tag }}

      - name: Create an empty draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ needs.select-tag.outputs.tag }}
        run: |
          release_tag="$INPUT_TAG"
          case "$release_tag" in
            v*) ;;
            *) release_tag="v$release_tag" ;;
          esac
          expected="v$(node -p "require('./package.json').version")"
          if [ "$release_tag" != "$expected" ]; then
            echo "::error::release tag $release_tag does not match package.json version $expected"
            exit 1
          fi

          if release_json="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            asset_count="$(printf '%s' "$release_json" | jq '.assets | length')"
            if [ "$is_draft" != "true" ] || [ "$asset_count" -ne 0 ]; then
              echo "::error::Release $release_tag must be an empty draft. Delete an incomplete draft and rerun; versioned assets are immutable."
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "StashBase $release_tag"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  extractor:
    needs: prepare-draft
    uses: ./.github/workflows/extractor-components.yml
    with:
      tag: ${{ needs.prepare-draft.outputs.tag }}
    secrets: inherit

  macos:
    needs: [prepare-draft, extractor]
    uses: ./.github/workflows/release-macos.yml
    with:
      tag: ${{ needs.prepare-draft.outputs.tag }}
    secrets: inherit

  windows:
    needs: [prepare-draft, extractor]
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.prepare-draft.outputs.tag }}
    secrets: inherit

  linux:
    needs: [prepare-draft, extractor]
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.prepare-draft.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [prepare-draft, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the complete update set and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-draft.outputs.tag }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          test "$(printf '%s' "$release_json" | jq -r '.isDraft')" = "true" || { echo "::error::Release $RELEASE_TAG is already public"; exit 1; }
          asset_names="$(printf '%s' "$release_json" | jq -r '.assets[].name')"
          release_version="${RELEASE_TAG#v}"

          require_asset() {
            pattern="$1"
            label="$2"
            matched=false
            while IFS= read -r asset_name; do
              case "$asset_name" in
                $pattern) matched=true; break ;;
              esac
            done <<< "$asset_names"
            $matched || { echo "::error::Missing $label for $RELEASE_TAG"; exit 1; }
          }

          require_asset 'latest-mac.yml' 'macOS update metadata'
          for mac_arch in arm64 x64; do
            require_asset "StashBase-${release_version}-mac-${mac_arch}.dmg" "macOS ${mac_arch} DMG"
            require_asset "StashBase-${release_version}-mac-${mac_arch}.zip" "macOS ${mac_arch} update archive"
          done
          require_asset 'latest.yml' 'Windows update metadata'
          require_asset "StashBase-${release_version}-win-*.exe" 'Windows installer'
          require_asset "StashBase-${release_version}-win-*.exe.blockmap" 'Windows blockmap'
          require_asset 'latest-linux.yml' 'Linux update metadata'
          require_asset "StashBase-${release_version}-linux-*.AppImage" 'Linux AppImage'
          require_asset "StashBase-${release_version}-linux-*.deb" 'Linux Debian package'

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  publish-homebrew:
    needs: [prepare-draft, publish-release]
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.prepare-draft.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download the published DMG
        run: |
          mkdir -p release.nosync
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-*.dmg' --dir release.nosync

      - name: Publish Homebrew cask
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required to update liliu-z/homebrew-stashbase"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "HOMEBREW_TAP_GIT_URL=https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/liliu-z/homebrew-stashbase.git" >> "$GITHUB_ENV"
          HOMEBREW_TAP_GIT_URL="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/liliu-z/homebrew-stashbase.git" node scripts/publish-homebrew.mjs
